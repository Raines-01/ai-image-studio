<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Image Studio</title>
<!-- Tailwind CSS -->
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<!-- Open Props -->
<link rel="stylesheet" href="https://unpkg.com/open-props@1.7.10/open-props.min.css">
<!-- Animate.css -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Wizard overlay -->
<div id="wizard-overlay" class="overlay hidden">
  <div class="modal">
    <h2>Welcome to AI Image Studio</h2>
    <div class="wizard-steps">
      <div class="wizard-step active" data-step="1"></div>
      <div class="wizard-step" data-step="2"></div>
      <div class="wizard-step" data-step="3"></div>
    </div>
    <div id="wizard-body" class="wizard-body"></div>
    <div class="wizard-nav">
      <button class="btn btn-secondary" id="wizard-back">
        <i data-lucide="arrow-left" style="width:16px;height:16px"></i>
        Back
      </button>
      <button class="btn btn-primary" id="wizard-next">
        Next
        <i data-lucide="arrow-right" style="width:16px;height:16px"></i>
      </button>
    </div>
  </div>
</div>

<!-- Settings overlay -->
<div id="settings-overlay" class="overlay hidden">
  <div class="modal modal-wide">
    <h2>Settings</h2>
    <div class="settings-layout">
      <div class="settings-sidebar" id="settings-list"></div>
      <div class="settings-content" id="settings-form"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="settings-new">
        <i data-lucide="plus" style="width:16px;height:16px"></i>
        New Config
      </button>
      <button class="btn btn-danger" id="settings-delete">
        <i data-lucide="trash-2" style="width:16px;height:16px"></i>
        Delete
      </button>
      <button class="btn btn-secondary" id="settings-test">
        <i data-lucide="wifi" style="width:16px;height:16px"></i>
        Test Connection
      </button>
      <button class="btn btn-primary" id="settings-save">
        <i data-lucide="save" style="width:16px;height:16px"></i>
        Save
      </button>
    </div>
  </div>
</div>

<!-- Viewer overlay -->
<div id="viewer-overlay" class="viewer-overlay hidden">
  <button class="viewer-close" id="viewer-close">
    <i data-lucide="x" style="width:28px;height:28px"></i>
  </button>
  <button class="viewer-nav viewer-prev" id="viewer-prev">
    <i data-lucide="chevron-left" style="width:28px;height:28px"></i>
  </button>
  <img class="viewer-img" id="viewer-img" src="" alt="">
  <button class="viewer-nav viewer-next" id="viewer-next">
    <i data-lucide="chevron-right" style="width:28px;height:28px"></i>
  </button>
  <div class="viewer-actions" id="viewer-actions">
    <button class="btn btn-secondary" id="viewer-download">
      <i data-lucide="download" style="width:16px;height:16px"></i>
      Download
    </button>
    <button class="btn btn-secondary" id="viewer-ref">
      <i data-lucide="copy" style="width:16px;height:16px"></i>
      Use as Reference
    </button>
    <button class="btn btn-secondary" id="viewer-inpaint">
      <i data-lucide="paintbrush" style="width:16px;height:16px"></i>
      Inpaint / 局部重绘
    </button>
  </div>
  <div class="viewer-info" id="viewer-info"></div>
</div>

<!-- History picker overlay -->
<div id="history-picker-overlay" class="overlay hidden">
  <div class="modal modal-wide">
    <h2>Select from History</h2>
    <div class="history-header" style="margin-top:0">
      <input type="text" id="history-picker-search" class="history-search" placeholder="Search...">
    </div>
    <div id="history-picker-grid" class="history-grid" style="max-height:400px;overflow-y:auto"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="history-picker-cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Header -->
<header>
  <div class="header-left">
    <img src="/static/logo.png" alt="Logo" class="header-logo">
    <h1>AI Image Studio</h1>
  </div>
  <div class="header-right">
    <select class="config-select" id="config-dropdown"></select>
    <button class="btn-icon" id="btn-settings" title="Settings">
      <i data-lucide="settings"></i>
    </button>
  </div>
</header>

<!-- Main -->
<main>
  <!-- Left panel -->
  <section class="panel-left">
    <div class="field">
      <label>Prompt / 提示词</label>
      <textarea id="prompt" placeholder="描述你想生成的图像...&#10;例: A cat wearing a top hat, oil painting style"></textarea>
    </div>

    <!-- Reference images -->
    <div class="field" id="ref-section">
      <label>Reference Images / 参考图片</label>
      <div class="drop-zone" id="drop-zone">
        <input type="file" id="ref-files" accept="image/*" multiple>
        <span>拖拽图片到这里、粘贴、或点击选择</span>
      </div>
      <div class="preview-row" id="ref-preview"></div>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-small btn-secondary" id="btn-from-history">
          <i data-lucide="history" style="width:14px;height:14px"></i>
          从历史选择
        </button>
        <button class="btn btn-small btn-secondary" id="btn-inpaint-upload" title="选择图片并进入局部重绘">
          <i data-lucide="brush" style="width:14px;height:14px"></i>
          局部重绘
        </button>
      </div>
    </div>

    <!-- Common params -->
    <div class="field">
      <label>Size / 尺寸</label>
      <div class="size-editor">
        <div class="size-presets">
          <button class="size-preset-btn active" data-w="1024" data-h="1024">1:1</button>
          <button class="size-preset-btn" data-w="1536" data-h="1024">3:2</button>
          <button class="size-preset-btn" data-w="1024" data-h="1536">2:3</button>
          <button class="size-preset-btn" data-w="1536" data-h="640">≈21:9</button>
          <button class="size-preset-btn" data-w="640" data-h="1536">9:21</button>
          <button class="size-preset-btn" data-value="auto">Auto</button>
        </div>
        <div class="size-row">
          <div class="size-inputs">
            <div class="field">
              <label class="size-dim-label">W</label>
              <input type="number" id="size-w" min="1" value="1024" step="8">
            </div>
            <button class="btn-link-icon" id="size-lock" title="Lock aspect ratio / 锁定宽高比">
              <svg class="lock-icon-unlocked" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
              </svg>
              <svg class="lock-icon-locked" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </button>
            <div class="field">
              <label class="size-dim-label">H</label>
              <input type="number" id="size-h" min="1" value="1024" step="8">
            </div>
          </div>
          <div class="size-preview-box">
            <div class="size-preview-rect" id="size-preview-rect"></div>
          </div>
        </div>
        <div class="size-hint" id="size-hint">1024 × 1024 · 1:1</div>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Quality / 质量</label>
        <select id="quality">
          <option value="auto">auto</option>
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high">high</option>
        </select>
      </div>
      <div class="field">
        <label>Format / 格式</label>
        <select id="output-format">
          <option value="png">png</option>
          <option value="jpeg">jpeg</option>
          <option value="webp">webp</option>
        </select>
      </div>
      <div class="field">
        <label>Count / 数量</label>
        <input type="number" id="num-images" min="1" max="10" value="1">
      </div>
    </div>

    <!-- Advanced params -->
    <details class="advanced-section">
      <summary>Advanced Parameters / 高级参数</summary>
      <div class="advanced-body">
        <div class="field">
          <label>Compression / 压缩率 (jpeg/webp, 0-100)</label>
          <input type="number" id="output-compression" min="0" max="100" placeholder="100">
        </div>
        <div class="field">
          <label>Moderation / 内容审查</label>
          <select id="moderation">
            <option value="auto">auto</option>
            <option value="low">low (更宽松)</option>
          </select>
        </div>
        <div class="field hidden" id="fidelity-field">
          <label>Input Fidelity / 输入保真度 (图生图)</label>
          <select id="input-fidelity">
            <option value="low">low</option>
            <option value="high">high (更匹配原图)</option>
          </select>
        </div>
      </div>
    </details>

    <!-- Output options -->
    <div class="field">
      <label>Output Directory / 输出目录</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="output-dir" placeholder="默认: ~/.ai-image-studio/data/" style="flex:1">
        <button class="btn btn-small btn-secondary" id="btn-browse-output">Browse</button>
      </div>
    </div>
    <div class="field">
      <label>Custom Filename / 自定义文件名 (可选)</label>
      <input type="text" id="custom-filename" placeholder="留空则自动生成">
    </div>

    <button class="btn btn-primary" id="btn-generate" style="width:100%;padding:12px">
      <i data-lucide="image" style="width:18px;height:18px"></i>
      <span class="btn-text">Generate / 生成</span>
    </button>
    <div class="mode-hint" id="mode-indicator">Mode: Text to Image / 文生图</div>
    <div class="status" id="status"></div>
  </section>

  <!-- Right panel -->
  <section class="panel-right">
    <div class="result-area" id="result-area">
      <div class="result-placeholder" id="result-placeholder">
        <div class="empty-glow animate__animated animate__pulse animate__infinite">
          <div class="empty-ring"></div>
          <div class="empty-ring"></div>
        </div>
        <div class="empty-text">Your imagination, AI powered</div>
        <div class="empty-sub">输入提示词，点击生成开始创作</div>
        <button class="btn btn-primary btn-start animate__animated animate__bounceIn" onclick="document.getElementById('prompt').focus()">
        <i data-lucide="sparkles" style="width:18px;height:18px"></i>
        Start Creating
      </button>
      </div>
    </div>
    <div class="queue-area">
      <div class="queue-header">
        <h3>Queue / 队列</h3>
      </div>
      <div id="queue-list"></div>
    </div>
  </section>
</main>

<!-- History -->
<section class="history-area">
  <div class="history-header">
    <h3 id="history-toggle">History / 历史记录 <span class="collapse-icon">&#9660;</span></h3>
    <div class="history-actions">
      <button class="btn btn-small" id="history-browse-btn">
        <i data-lucide="folder-open" style="width:14px;height:14px"></i>
        Browse Folder / 浏览文件夹
      </button>
      <button class="btn btn-small btn-danger" id="history-delete-all-btn">
        <i data-lucide="trash-2" style="width:14px;height:14px"></i>
        Delete All / 清空
      </button>
      <input type="text" id="history-search" class="history-search" placeholder="Search by prompt / 按提示词搜索历史记录..." style="width:380px">
    </div>
  </div>
  <div id="history-browse-bar" class="hidden history-browse-bar">
    <input type="text" id="history-browse-path" class="history-browse-path" placeholder="/path/to/output/folder">
    <button class="btn btn-small btn-secondary" id="history-browse-pick">选择目录</button>
    <button class="btn btn-small" id="history-back-btn">Back to History / 返回历史记录</button>
  </div>
  <div id="history-grid" class="history-grid"></div>
</section>

<!-- Context menu (hidden) -->
<div id="context-menu" class="context-menu hidden"></div>

<!-- Mask Editor overlay -->
<div id="mask-editor-overlay" class="mask-editor-overlay hidden">
  <div class="mask-editor-header">
    <button class="btn btn-secondary btn-small" id="mask-cancel">
      <i data-lucide="x" style="width:14px;height:14px"></i>
      Cancel / 取消
    </button>
    <span class="mask-editor-title">
      <i data-lucide="paintbrush" style="width:14px;height:14px"></i>
      Mask Editor / 遮罩编辑器 — paint areas to regenerate
    </span>
    <button class="btn btn-primary btn-small" id="mask-confirm">
      <i data-lucide="check" style="width:14px;height:14px"></i>
      Confirm / 确认
    </button>
  </div>
  <div class="mask-editor-canvas-wrap" id="mask-canvas-wrap"></div>
  <div class="mask-editor-toolbar" id="mask-toolbar">
    <button class="btn btn-small btn-secondary active" id="mask-brush-btn" title="Brush / 画笔 (B)">
      <i data-lucide="brush" style="width:14px;height:14px"></i>
      Brush
    </button>
    <button class="btn btn-small btn-secondary" id="mask-eraser-btn" title="Eraser / 橡皮擦 (E)">
      <i data-lucide="eraser" style="width:14px;height:14px"></i>
      Eraser
    </button>
    <div class="mask-size-control">
      <label>Size</label>
      <input type="range" id="mask-brush-size" min="5" max="200" value="30">
      <span id="mask-brush-size-label">30</span>
    </div>
    <button class="btn btn-small btn-secondary" id="mask-undo-btn" title="Undo / 撤销 (Ctrl+Z)">
      <i data-lucide="undo-2" style="width:14px;height:14px"></i>
      Undo
    </button>
    <button class="btn btn-small btn-danger" id="mask-clear-btn" title="Clear / 清除">
      <i data-lucide="trash" style="width:14px;height:14px"></i>
      Clear
    </button>
  </div>
</div>

<!-- Toast notifications -->
<div id="toast-container" class="toast-container"></div>

<script src="/static/api.js"></script>
<script src="/static/toast.js"></script>
<script src="/static/viewer.js"></script>
<script src="/static/mask-editor.js"></script>
<script src="/static/wizard.js"></script>
<script src="/static/settings.js"></script>
<script src="/static/queue.js"></script>
<script src="/static/history.js"></script>
<script src="/static/app.js"></script>
<script>
  // Initialize Lucide icons
  lucide.createIcons();
</script>
</body>
</html>
